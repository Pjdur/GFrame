<html><head><meta charset='UTF-8'>
<meta name='viewport' content='width=device-width, initial-scale=1'>
<title>ScreenX - Live Stream</title>
<style>
:root { 
    --bg: #0f172a; 
    --card-bg: #1e293b; 
    --border: #334155; 
    --text: #f8fafc; 
    --btn-hover: #475569;
    --online: #22c55e;
    --offline: #ef4444;
}
[data-theme="light"] { 
    --bg: #f1f5f9; 
    --card-bg: #ffffff; 
    --border: #cbd5e1; 
    --text: #0f172a; 
    --btn-hover: #e2e8f0;
}
html, body { height: 100vh; margin: 0; padding: 0; background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; overflow: hidden; display: flex; flex-direction: column; box-sizing: border-box; transition: background 0.2s, color 0.2s; }
header { display: flex; justify-content: space-between; align-items: center; padding: 12px 24px; border-bottom: 1px solid var(--border); background: var(--card-bg); flex-shrink: 0; transition: background 0.2s, border-color 0.2s; }
h2 { margin: 0; font-size: 1.25rem; font-weight: 600; display: flex; align-items: center; gap: 10px; }
.header-right { display: flex; align-items: center; gap: 12px; }
.status-badge { display: flex; align-items: center; gap: 6px; font-size: 0.8125rem; font-weight: 500; background: var(--bg); padding: 4px 10px; border-radius: 20px; border: 1px solid var(--border); }
.status-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--offline); transition: background 0.3s; }
.status-dot.live { background: var(--online); box-shadow: 0 0 8px rgba(34, 197, 94, 0.4); }
.action-btn { background: var(--card-bg); border: 1px solid var(--border); color: var(--text); padding: 6px 12px; border-radius: 6px; font-weight: 600; font-size: 0.875rem; cursor: pointer; transition: background 0.2s; }
.action-btn:hover { background: var(--btn-hover); }
.stream-wrapper { flex: 1; display: flex; justify-content: center; align-items: center; padding: 16px; overflow: hidden; background: var(--bg); }
.stream-container { position: relative; max-width: 100%; max-height: 100%; display: flex; justify-content: center; align-items: center; border: 1px solid var(--border); border-radius: 8px; overflow: hidden; background: #000; box-shadow: 0 10px 15px -3px rgba(0,0,0,0.15); }
.stream-container img { display: block; max-width: 100%; max-height: calc(100vh - 100px); width: auto; height: auto; object-fit: contain; cursor: pointer; }
</style>
<script>
function setTheme(theme) {
    document.documentElement.setAttribute('data-theme', theme);
    localStorage.setItem('screenx_theme', theme);
    document.getElementById('themeToggle').innerText = theme === 'light' ? '🌙' : '☀️';
}
function toggleTheme() {
    const current = localStorage.getItem('screenx_theme') || 'dark';
    setTheme(current === 'dark' ? 'light' : 'dark');
}

function toggleFullscreen() {
    const container = document.getElementById('streamContainer');
    if (!document.fullscreenElement) {
        container.requestFullscreen().catch(err => console.error(err));
    } else {
        document.exitFullscreen();
    }
}

window.addEventListener('DOMContentLoaded', () => {
    const saved = localStorage.getItem('screenx_theme') || 'dark';
    setTheme(saved);

    const img = document.getElementById('streamImg');
    const dot = document.getElementById('statusDot');
    const statusText = document.getElementById('statusText');

    // Auto-reconnect and live status monitoring for the MJPEG stream
    function updateStatus(isLive) {
        if (isLive) {
            dot.classList.add('live');
            statusText.innerText = 'Live';
        } else {
            dot.classList.remove('live');
            statusText.innerText = 'Reconnecting...';
        }
    }

    img.onload = () => updateStatus(true);
    img.onerror = () => {
        updateStatus(false);
        setTimeout(() => {
            // Force reload the stream source with a timestamp to bust cache
            img.src = '/stream?t=' + Date.now();
        }, 2000);
    };

    // Heartbeat check: if the image hasn't loaded frames or stalled, trigger error handling
    let lastNaturalWidth = 0;
    setInterval(() => {
        if (img.naturalWidth > 0 && img.naturalWidth === lastNaturalWidth) {
            // Stream might have frozen, bump it
            // Optional safety net, but onload/onerror usually handles drops
        }
        lastNaturalWidth = img.naturalWidth;
    }, 3000);
});
</script>
</head><body>
<header>
  <h2>⚡ ScreenX</h2>
  <div class="header-right">
    <div class="status-badge">
      <div id="statusDot" class="status-dot"></div>
      <span id="statusText">Connecting</span>
    </div>
    <button class='action-btn' onclick='toggleFullscreen()' title='Toggle Fullscreen'>🖵 Fullscreen</button>
    <button id='themeToggle' class='action-btn' onclick='toggleTheme()'></button>
  </div>
</header>
<div class='stream-wrapper'>
  <div class='stream-container' id='streamContainer'>
    <img id='streamImg' src='/stream' alt='Live desktop stream'>
  </div>
</div>
</body></html>
